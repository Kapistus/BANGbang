# Tile palette for the map editor and the game.
#
# Tiles are now PURE ART. A tile carries only png / name / colour / group.
# How a painted cell behaves is set by the editor's Floor / Wall toggle, not
# by the tile:
#   Floor cell  -> walkable, see-through, no blocking. Drawn at full brightness.
#   Wall cell   -> blocks movement, sight and shots, and encloses a room for
#                  the auto-roof. Drawn darker (sim/tilemap.WALL_DARKEN).
# `footstep_mult` / `sound_cost` on a tile are still read for a Floor cell so
# a grating floor can be loud.
#
# The exceptions are the three SPECIAL tiles below - door, window, bush - which
# keep fixed behaviour and ignore the Floor/Wall toggle (they always place on
# the object layer).
#
# Roofs are automatic: any area a wall / window / door loop seals off from the
# map border is roofed at load (see sim/tilemap.compute_roof).

[meta]
tile_px = 128
default_floor = "blank"

# ---- base tile -------------------------------------------------------------

[tiles.blank]
png = "blank.png"
name = "Blank"
colour = [150, 150, 150]

# ---- special tiles (fixed behaviour, ignore the Floor/Wall toggle) --------

[tiles.window]
png = "window.png"
layer = "object"
name = "Window (glass)"
is_see_through = true
is_walkable = false
blocks_los = false
blocks_shots = true
glass = true
sound_cost = 6.0
pen_cost = 0.3
colour = [176, 198, 206]

[tiles.door]
png = "door.png"
layer = "object"
name = "Door"
is_see_through = false
is_walkable = false
blocks_los = true
blocks_shots = true
door = true
sound_cost = 10.0
pen_cost = 1.8
colour = [150, 118, 78]

[tiles.bush]
png = "bush.png"
layer = "object"
name = "Bush (concealment)"
is_see_through = false
is_walkable = true
blocks_los = true
blocks_shots = false
footstep_mult = 1.1
sound_cost = 1.0
pen_cost = 0.0
overlay = true          # canopy draws over characters; texture gaps let them peek
colour = [86, 120, 66]

