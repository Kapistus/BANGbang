# Tile palette for the map editor and the game.
#
# Every entry has the four gameplay booleans the editor exposes:
#   is_see_through  can the player/guards see THROUGH this cell (visually)
#   is_walkable     can an actor stand/move here
#   blocks_los      does it stop line-of-sight for the vision system
#   blocks_shots    does it stop bullets
#
# Plus values the sim needs. If any of sound_cost / footstep_mult / pen_cost
# are omitted, sim/tileset.py derives a sensible default from the booleans.
#
#   layer = "floor"   painted on the base layer (every cell has one)
#   layer = "object"  painted on top (walls, doors, props); "" clears it
#
# Swap the placeholder PNGs in this folder for real art at the same size.

[meta]
tile_px = 32
default_floor = "floor"

# ---- floor layer -------------------------------------------------------

[tiles.floor]
png = "floor.png"
layer = "floor"
name = "Floor"
is_see_through = true
is_walkable = true
blocks_los = false
blocks_shots = false
colour = [216, 214, 205]

[tiles.concrete]
png = "concrete.png"
layer = "floor"
name = "Concrete"
is_see_through = true
is_walkable = true
blocks_los = false
blocks_shots = false
colour = [188, 186, 180]

